name = "stocker"
main = "api/src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# The built React app is served straight from the Worker.
# `run_worker_first` keeps /api/* on the Worker; everything else falls through
# to the static assets, with SPA fallback to index.html.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "stocker"
# Replace with the id printed by: wrangler d1 create stocker
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "db/migrations"

# Every 15 minutes, Mon-Fri, 13:00-21:45 UTC (covers the US session incl. the
# 21:30 UTC post-close run that also writes the daily snapshot).
[triggers]
crons = ["0,15,30,45 13-21 * * 1-5"]

[vars]
# Non-secret defaults. Secrets (APP_TOKEN, FINNHUB_API_KEY) go via `wrangler secret put`.
SNAPSHOT_HOUR_UTC = "21"
